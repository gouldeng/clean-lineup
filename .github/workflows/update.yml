name: Update data and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "0 */3 * * *"   # every 3 hours (UTC)

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SITE_URL: https://cleanlineup.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # San Diego's sdbeachinfo.com is a JS app; fetch.py reads it with headless Chromium.
      - run: python -m playwright install --with-deps chromium
      - name: Fetch sources
        run: python fetch.py
      - name: Build site
        run: python build.py
      - name: Source health
        run: |
          python - <<'PY'
          import json
          d = json.load(open("data/spots.json"))
          print("status counts:", d["status_counts"])
          for k, v in d["sources"].items():
              print(f'{k:28} {"OK" if v["ok"] else "FAIL  " + v.get("error", "")}')
          PY
      - name: Commit refreshed data
        run: |
          git config user.name "clean-lineup-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/spots.json
          if ! git diff --cached --quiet; then
            git commit -m "data: refresh $(date -u +%FT%TZ)"
            git pull --rebase -X ours origin main || true
            git push || echo "push skipped (branch moved); site still deploys"
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
